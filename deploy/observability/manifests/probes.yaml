# Prod's WebSocket upgrade, end to end: 101, or realtime is broken for
# everyone while every page still loads.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: websocket-prod
  namespace: monitoring
spec:
  module: http_ws_101
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox.monitoring:9115
  targets:
    staticConfig:
      static: [https://cylist.in/api/v1/agent-sessions/blackbox-probe/ws]
      labels:
        environment: prod
