name: Refresh staging from production

# Manual only. This drops everything staging holds and reloads it from a
# fresh production dump, database and uploaded files together, so it does not
# belong on any push trigger. It runs deploy/k3s/staging-refresh.sh, which
# copies production on K3s (cylist-prod) into staging on K3s (cylist-staging);
# see that script for what actually happens. Production is only read.
on:
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh staging
    runs-on: [self-hosted, cylist]
    environment:
      name: staging
      url: https://stage.cylist.in

    steps:
      - uses: actions/checkout@v5

      - name: Refresh
        env:
          # The cylist-deployer service account: the cylist-* namespaces only.
          KUBECONFIG: /home/dnu2/.kube/cylist-deployer.yaml
        run: deploy/k3s/staging-refresh.sh --yes
