name: Deploy dev

# Manual, and not tied to any branch: GitHub's own "Run workflow" dropdown lets
# you pick whichever branch to run this from, and actions/checkout below
# follows that same ref by default. That is the whole mechanism — no branch
# input to maintain here.
#
# Unlike CI's deploy jobs, this does not `needs:` the test jobs. Dev exists so
# you can put work here before it is finished, not after it has already passed
# everything staging would demand of it.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy dev to dnu-home-1
    runs-on: [self-hosted, cylist]
    environment:
      name: dev
      url: https://dnu-home-1.tail222f46.ts.net:9443

    steps:
      - uses: actions/checkout@v5

      # Dev asks jev with production's key rather than one of its own: jev is a
      # paid API, not per-environment state, and a key that exists once is a
      # key that is rotated once. Copied across on every deploy, so dev follows
      # a rotation, and never printed — it goes file to file on this machine.
      - name: Use production's jev key
        run: |
          umask 077
          dev="${CYLIST_DEV_DIR:-$HOME/cylist-dev}/app.env"
          prod="${CYLIST_PROD_DIR:-$HOME/cylist-prod}/app.env"
          key_line='^(CYLIST_)?JEV_API_KEY=.'
          if ! grep -qE "$key_line" "$prod" 2>/dev/null; then
            echo "::warning::production has no JEV_API_KEY, so dev keeps its own (if any)"
            exit 0
          fi
          { grep -vE '^(CYLIST_)?JEV_API_KEY=' "$dev" || true; grep -m1 -E "$key_line" "$prod"; } \
            > "$dev.new"
          mv "$dev.new" "$dev"
          echo "dev now uses production's jev key"

      # Builds the image, dumps the database, migrates, restarts the stack and
      # waits for /api/v1/health — the same script production and staging use.
      - name: Deploy
        run: scripts/deploy.sh dev
