# Scrape targets that no chart ships (CYLIST-194). cloudflared is scraped by
# Alloy from the host network (alloy/config.alloy); the Cylist chart ships its
# own PodMonitors.

# Traefik: per-host request rate, latency and 5xx at the edge, including
# requests that never reached an app pod. K3s's chart makes the Service
# (deploy/k3s/host/traefik-config.yaml) but not the monitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 30s
