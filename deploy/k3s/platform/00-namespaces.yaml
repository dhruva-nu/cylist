# One namespace per environment class. The five dev slots share cylist-dev,
# as they share one dev postgres today.
apiVersion: v1
kind: Namespace
metadata:
  name: cylist-prod
  labels:
    cylist.in/env: prod
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cylist-staging
  labels:
    cylist.in/env: staging
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cylist-dev
  labels:
    cylist.in/env: dev
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/warn: baseline
---
# The image registry runs on the host network (see registry.yaml), which
# baseline forbids, so this namespace is privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
  labels:
    pod-security.kubernetes.io/enforce: privileged
