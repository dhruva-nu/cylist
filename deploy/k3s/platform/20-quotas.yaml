# Ceilings per namespace, sized for a 16-CPU / 30 GiB host that also runs the
# Docker stacks until Phase 7. Phase 0 measured each app idle at ~140 MiB and
# each postgres at ~110 MiB. The LimitRange gives every container defaults, so
# a pod without resources set is still admitted under the quota.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: cylist-prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: cylist-prod
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        memory: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: cylist-staging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: cylist-staging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
      max:
        memory: 2Gi
---
# Five app slots, the dev index and the shared dev postgres.
apiVersion: v1
