# Production: cylist.in, in namespace cylist-prod.
priorityClassName: cylist-prod
environment: prod

app:
  host: cylist.in
  env:
    CYLIST_ENVIRONMENT: prod
    # One request in five traced, to start (02-observability-design.md).
    CYLIST_TRACE_SAMPLE_RATIO: "0.2"
    # Only the public address: nothing deployed listens on a localhost port
    # any more, and on this machine localhost:8000 is `make dev-api`.
    CYLIST_CLIENT_URLS: '["https://cylist.in"]'
  fcmSecret: cylist-fcm
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 1536Mi

database:
  storage: 20Gi
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 2Gi

blobs:
  storage: 20Gi

backup:
  storage: 40Gi
