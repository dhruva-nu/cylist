# The production stack, as it runs on dnu-home-1.
#
#   scripts/deploy.sh          builds, migrates and restarts it
#   make prod-logs             follows it
#
# Two containers, not four. The API image already carries the built SPA (see
# backend/Dockerfile), so there is no separate web server, and Postgres
# publishes no port at all — only the app container can reach it, over the
# compose network.
#
# The app listens on 127.0.0.1:8000 rather than every interface: the only thing
# that should reach it directly is `tailscale serve`, which terminates HTTPS and
# proxies to loopback. Binding 0.0.0.0 here would put the app on the LAN behind
# nothing.
#
# Secrets live outside the repository, in $CYLIST_PROD_DIR — a directory CI
# never checks out or overwrites, so a deploy cannot clobber the vault key.

name: cylist-prod

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      # POSTGRES_PASSWORD, and the user and database the app connects as.
      - ${CYLIST_PROD_DIR:?set CYLIST_PROD_DIR to the directory holding app.env and postgres.env}/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cylist -d cylist"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One process is plenty here, but not a rule: a second worker or replica
  # shares the board's news over Postgres LISTEN/NOTIFY. See DEPLOY.md, "More
  # than one worker", for the two things that stay per process.
  app:
    build:
      # The root, because this image builds the SPA as well as the API.
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: cylist:latest
    env_file:
      # CYLIST_DATABASE_URL, CYLIST_PASSWORD_HASH, CYLIST_VAULT_KEY.
      #
      # Raw, because an argon2 hash is full of `$` and compose would otherwise
      # read `$argon2id$v=19$...` as three empty variables and blank the
      # password out from under you.
      - path: ${CYLIST_PROD_DIR:?set CYLIST_PROD_DIR to the directory holding app.env and postgres.env}/app.env
        format: raw
    environment:
      # Fixed by the deployment rather than by the secrets file, so that file
      # holds only things that are actually secret.
      CYLIST_ENVIRONMENT: prod
      CYLIST_DATA_DIR: /data
      CYLIST_WEB_DIR: /app/web
      # Empty on purpose. The SPA is served by this same process, so every
      # request is same-origin and no CORS middleware is installed at all —
      # which is the strongest setting, not a missing one.
      CYLIST_CORS_ORIGINS: "[]"
      # Every address a client can reach this stack at, handed to the CLI and
      # the MCP server by `GET /setup` so they store all of them and try them
      # in order — which is what lets one `cylist setup` keep working on the
      # tailnet, off it, and on this machine itself. Advisory data returned to
      # callers: the app never dials these, so `localhost` here means the
      # caller's localhost, not the container's.
      CYLIST_CLIENT_URLS: '["http://localhost:8000","https://cylist.in"]'
      # Requests reach this container from cloudflared on the host, over the
      # Docker bridge, so the socket's peer is always the bridge gateway. The
      # real client is in CF-Connecting-IP, believed only from these networks
      # (CYLIST-122) — the sign-in log and the login rate limit depend on it.
      CYLIST_TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'
    ports:
      # Loopback only. See the note at the top of this file.
      - "127.0.0.1:8000:8000"
    volumes:
      - cylist-data:/data
      # The Firebase service-account key for agent pushes (CYLIST-107). It must
      # exist before this is deployed: a bind mount of a missing file makes
      # Docker create an empty directory in its place. See DEPLOY.md.
      - ${CYLIST_PROD_DIR}/fcm-service-account.json:/run/secrets/fcm-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named for this project (cylist-prod), so they are distinct from the
  # development stack's volumes even on a machine that has run both.
  postgres-data:
  cylist-data:
