# cAdvisor for the Docker stacks (CYLIST-194), the before half of the
# before/after: what the Docker-era containers use, while they still serve.
# K3s's own containers are measured by the kubelet's built-in cAdvisor, so
# this one reports only Docker's. Remove in Phase 7 with the stacks.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: docker-cadvisor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: docker-cadvisor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-cadvisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-cadvisor
    spec:
      priorityClassName: cylist-platform
      automountServiceAccountToken: false
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.55.1
          args:
            - --docker_only=true
            - --housekeeping_interval=30s
            - --store_container_labels=false
            - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
            - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
          securityContext:
            privileged: true
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: rootfs, mountPath: /rootfs, readOnly: true}
            - {name: var-run, mountPath: /var/run, readOnly: true}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: docker, mountPath: /var/lib/docker, readOnly: true}
            - {name: disk, mountPath: /dev/disk, readOnly: true}
      volumes:
        - {name: rootfs, hostPath: {path: /}}
        - {name: var-run, hostPath: {path: /var/run}}
        - {name: sys, hostPath: {path: /sys}}
        - {name: docker, hostPath: {path: /var/lib/docker}}
        - {name: disk, hostPath: {path: /dev/disk}}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: docker-cadvisor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-cadvisor
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      # The compose project names the environment, as Alloy's log labels do.
      metricRelabelings:
        - sourceLabels: [container_label_com_docker_compose_project]
          regex: cylist-(prod|staging|dev-[1-5])
          targetLabel: environment
        - sourceLabels: [container_label_com_docker_compose_project]
          regex: cylist-dev-db
          replacement: dev
          targetLabel: environment
        - sourceLabels: [container_label_com_docker_compose_service]
          targetLabel: compose_service
        - regex: container_label_com_docker_compose_(project|service)
          action: labeldrop
        - targetLabel: runtime
          replacement: docker
