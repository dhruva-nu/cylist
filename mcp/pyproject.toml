[project]
name = "cylist-mcp"
version = "0.1.0"
description = "An MCP server exposing Cylist's HTTP API as tools an agent can call."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.28",
]

[project.scripts]
cylist-mcp = "cylist_mcp.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cylist_mcp"]

# --- Lint / format ---------------------------------------------------------
# Deliberately identical to backend/pyproject.toml: one house style across the
# monorepo, so moving between packages needs no re-learning.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "S",        # bandit (security)
    "PTH",      # use pathlib
    "TID",      # tidy imports
]
ignore = [
    "S101",  # assert: used deliberately in tests
    "B008",  # function call in argument default
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test credentials are fine

[tool.ruff.lint.isort]
known-first-party = ["cylist_mcp"]

# --- Types -----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
follow_untyped_imports = true

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
