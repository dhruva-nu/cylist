[project]
name = "jev"
version = "0.1.0"
description = "Python SDK for the Jev System One API (TypeSafe): typed choice / score / yes-no questions about any content."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]

[dependency-groups]
dev = ["pytest>=8", "opentelemetry-sdk>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Jev API (needs JEV_API_KEY)"]
