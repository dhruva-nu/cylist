name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are worth cancelling. A run that ends in a
  # deploy is not: a deploy cancelled between `alembic upgrade` and the
  # container restart leaves the server in a state nobody chose. Only `main`
  # ends in a deploy now — a push to `staging` runs the tests and stops, and
  # the deploy itself lives in deploy-staging.yml, under its own concurrency.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CYLIST_DATABASE_URL: postgresql+asyncpg://cylist:cylist@localhost:5432/cylist_test
  CYLIST_TEST_DATABASE_URL: postgresql+asyncpg://cylist:cylist@localhost:5432/cylist_test

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cylist
          POSTGRES_PASSWORD: cylist
          POSTGRES_DB: cylist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cylist -d cylist_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app scripts

      - name: Test
        run: uv run pytest -q

      # Proves the migrations produce exactly the schema the models describe,
      # and that every revision reverses cleanly. Uses its own scratch database.
      - name: Verify migrations
        run: uv run python -m scripts.check_migrations

  # The CLI and the MCP server talk to the API over HTTP and are tested against
  # an httpx.MockTransport, so neither needs a database or a running backend.
  agents:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: CLI, dir: cli }
          - { name: MCP server, dir: mcp }

    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package.dir }}/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Everything above runs on GitHub's machines. This one runs on dnu-home-1
  # itself, through a self-hosted runner that polls GitHub outbound — which is
  # why deploying to a server behind a home router needs no inbound port, no
  # deploy key, and no secrets stored in this repository.
  deploy:
    name: Deploy to dnu-home-1
    needs: [backend, agents, frontend]
    # Only main, and only a real push: a pull request that happens to target
    # main must not put anything on the server. A push to `staging` gets the
    # three test jobs above and nothing else — staging is deployed by hand,
    # from .github/workflows/deploy-staging.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cylist]
    environment:
      name: production
      url: https://dnu-home-1.tail222f46.ts.net

    steps:
      - uses: actions/checkout@v5

      # Builds the image, dumps the database, migrates, restarts the stack and
      # waits for /api/v1/health. The same script deploys by hand over SSH.
      - name: Deploy
        run: scripts/deploy.sh
