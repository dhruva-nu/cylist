[project]
name = "cylist-backend"
version = "0.1.0"
description = "Cylist API — projects, boards, files and a vault, for humans and agents alike."
requires-python = ">=3.12,<3.13"
dependencies = [
    # 0.141 is where a dependency can declare `scope="function"`, which is
    # what makes the request commit before its response goes out — see
    # app/db.py.
    "fastapi>=0.141",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "cryptography>=44.0",
    # The time zone database, carried rather than borrowed from the base image.
    # `python:3.12-slim` ships only the canonical zones, so `Asia/Calcutta` —
    # which is the name a good many browsers report for India — is not a key it
    # can open, and neither are `US/Pacific` or `Hongkong`. zoneinfo falls back
    # to this package for anything it cannot find on TZPATH, which makes the
    # zones a deployment knows the lockfile's business instead of the base
    # image's. See app/core/timezones.py.
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Lint / format ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "S",        # bandit (security)
    "PTH",      # use pathlib
    "TID",      # tidy imports
]
ignore = [
    "S101",  # assert: used deliberately in tests
    "B008",  # function call in argument default: this is how FastAPI DI works
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test credentials are fine
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Types -----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
