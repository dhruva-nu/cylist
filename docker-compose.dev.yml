# One dev slot, alongside production and staging on dnu-home-1. There are five,
# all built from this one file.
#
#   scripts/deploy.sh dev 2       builds, migrates and restarts slot 2
#   make dev-logs SLOT=2          follows it
#
# The same app container as production and staging, and deliberately the same
# shape: one image serving the API and the built SPA. What it does not have is
# a Postgres of its own: every slot uses the one in docker-compose.dev-db.yml,
# so the data is the same whichever slot you open — unless its branch has
# migrations main does not, when it gets a database of its own on that Postgres.
#
# Unlike staging, a slot is not tied to any one branch. The deploy workflow is
# workflow_dispatch — you pick the branch in GitHub's "Run workflow" dropdown
# and the slot (1–5) as its input, so five branches can be looked at side by
# side, tested with real infrastructure, before that work earns a place on the
# `staging` branch. The shared database starts empty and is never restored from
# production the way staging is, so no slot ever needs the production vault key.
#
# Everything slot-specific comes from CYLIST_DEV_SLOT, which deploy.sh and the
# Make targets set; there is no default, so a command that forgot which slot it
# meant fails here instead of acting on some other slot. What differs from
# docker-compose.staging.yml is only what has to:
#
#   * the compose project name, `cylist-dev-N`, so each slot's containers never
#     collide with production's, staging's or another slot's;
#   * the image tag — `cylist:dev-N`, for the same reason staging has its own
#     tag: building one slot must not move the tag another environment, or
#     another slot, restarts from;
#   * port 801N, because production holds 8000 and staging 8001;
#   * a hostname of its own, devN.cylist.in, on the Cloudflare Tunnel, so it is
#     served at the site root like production and staging and CYLIST_BASE_PATH
#     stays empty. (The slots used to share one tailnet port and be told apart
#     by path, /dev_N; Settings still accepts a base path for that shape);
#   * CYLIST_ENVIRONMENT=preview, which Settings.is_deployed treats as
#     deployed (Secure session cookie, make seed refused) without touching
#     what CYLIST_ENVIRONMENT=dev means for someone's own machine — see the
#     docstring on that property.

name: cylist-dev-${CYLIST_DEV_SLOT:?set CYLIST_DEV_SLOT to the dev slot, 1-5}

services:
  # Exactly one replica, and no --workers on the uvicorn command. The registry
  # of who is connected over a WebSocket lives in this process: a second one
  # would split the fan-out silently, freezing most open boards, and its
  # startup sweep would end the agent sessions its peer was holding. See
  # DEPLOY.md, "Never add --workers".
  app:
    build:
      # The root, because this image builds the SPA as well as the API.
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        # Harmless if the Dockerfile declares no such ARG; there for when the
        # SPA has to know its prefix at build time. Empty: each slot has a
        # hostname of its own (devN.cylist.in) and is served at the root.
        CYLIST_BASE_PATH: ""
    # Not cylist:latest, cylist:staging or another slot's tag. See the note at
    # the top of this file.
    image: cylist:dev-${CYLIST_DEV_SLOT}
    env_file:
      # CYLIST_DATABASE_URL, CYLIST_PASSWORD_HASH, CYLIST_VAULT_KEY — the same
      # file for every slot, in ~/cylist-dev-shared, since they share one
      # database and so must share the key its vault is sealed with.
      #
      # Raw, because an argon2 hash is full of `$` and compose would otherwise
      # read `$argon2id$v=19$...` as three empty variables and blank the
      # password out from under you.
      - path: ${CYLIST_DEV_DIR:?set CYLIST_DEV_DIR to the shared dev directory holding app.env}/app.env
        format: raw
      # Only there while the slot's branch has migrations main does not: then
      # its CYLIST_DATABASE_URL, read after app.env and so winning over it,
      # points the slot at a copy of the shared database of its own,
      # cylist_slot_N, rather than at the shared one. Written and removed by
      # dev_slot_database in scripts/dev-slot.sh; see DEPLOY.md, "One database
      # for every slot".
      - path: ${CYLIST_DEV_DIR}/../cylist-dev-${CYLIST_DEV_SLOT}/db.env
        format: raw
        required: false
    environment:
      # Not "dev" — see the note at the top of this file and the docstring on
      # Settings.is_deployed.
      CYLIST_ENVIRONMENT: preview
      # Unset on purpose: slot N is https://devN.cylist.in/, at the root, so
      # there is no prefix for the app to add back or the cookie to be scoped
      # to. (Settings still accepts one, for a slot served under a path.)
      CYLIST_BASE_PATH: ""
      CYLIST_DATA_DIR: /data
      CYLIST_WEB_DIR: /app/web
      # Empty on purpose, as in production and staging: the SPA is served by
      # this same process, so every request is same-origin and no CORS
      # middleware is installed at all.
      CYLIST_CORS_ORIGINS: "[]"
      # As production and staging, for this slot: loopback, then the slot's
      # own hostname through the Cloudflare Tunnel (see DEPLOY.md, "Dev").
      CYLIST_CLIENT_URLS: '["http://localhost:801${CYLIST_DEV_SLOT}","https://dev${CYLIST_DEV_SLOT}.cylist.in"]'
      # As in production: the peer is the Docker bridge, the client is in
      # CF-Connecting-IP, and the header is believed only from the bridge.
      CYLIST_TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'
    ports:
      # Loopback only, 8011–8015. cloudflared relays devN.cylist.in here
      # (ingress rule in /etc/cloudflared/config.yml); nothing else should
      # reach it directly.
      - "127.0.0.1:801${CYLIST_DEV_SLOT}:8000"
    volumes:
      # The slot's own logs, and below them the blobs every slot shares: a file
      # is a row in the shared database plus its bytes here, so a file uploaded
      # on one slot has to download on another.
      - cylist-data:/data
      - blobs:/data/blobs
    networks:
      - dev
    # No depends_on: the database is another project's. deploy.sh starts it,
    # healthy, before it migrates or starts any slot.
    restart: unless-stopped

networks:
  # Made by docker-compose.dev-db.yml; the shared Postgres answers on it as
  # `cylist-dev-db`.
  dev:
    name: cylist-dev
    external: true

volumes:
  # Named for the slot's project (cylist-dev-N), so it never reaches
  # production's, staging's or another slot's.
  cylist-data:
  # One for all five, made by dev-slot.sh.
  blobs:
    name: cylist-dev-blobs
    external: true
