# Outside-in uptime (CYLIST-194): blackbox-exporter fetches each public URL
# through public DNS, Cloudflare's edge, the tunnel, Traefik and the app. ProdDown and EnvDown read these.
# One Probe per environment, so each carries its environment label.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: uptime-prod
  namespace: monitoring
spec:
  module: http_2xx
  interval: 30s
  scrapeTimeout: 15s
  prober:
    url: blackbox.monitoring:9115
  targets:
    staticConfig:
      static: [https://cylist.in/api/v1/health]
      labels:
        environment: prod
---
