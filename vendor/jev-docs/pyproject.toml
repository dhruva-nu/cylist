[project]
name = "jevdocs"
version = "0.1.0"
description = "Route a question to the right documentation file and section using the Jev System One API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jev", "httpx>=0.25"]

[project.scripts]
jevdocs = "jevdocs.cli:main"

[tool.uv.sources]
jev = { path = "../jev-sdk" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
