name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are worth cancelling. A run that ends in a
  # deploy is not: a deploy cancelled between `alembic upgrade` and the
  # container restart leaves the server in a state nobody chose. Only `main`
  # ends in a deploy now — a push to `staging` runs the tests and stops, and
  # the deploy itself lives in deploy-staging.yml, under its own concurrency.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CYLIST_DATABASE_URL: postgresql+asyncpg://cylist:cylist@localhost:5432/cylist_test
  CYLIST_TEST_DATABASE_URL: postgresql+asyncpg://cylist:cylist@localhost:5432/cylist_test

jobs:
  # Which suites this run needs. Going to `main` — a pull request into it, or
  # the push that deploys — runs every one, unconditionally. Anywhere else a
  # suite runs only when something it reads has changed: a frontend-only pull
  # request does not wait on Postgres and pytest. The backend imports the MCP
  # server and the vendored jev packages (backend/pyproject.toml), so a change
  # to either reruns the backend too. A change to this file reruns everything,
  # as does any diff that cannot be worked out (a new branch's first push).
  #
  # A job skipped by its `if:` reports as passing, so a required check on a
  # suite that did not need to run does not hold a pull request up.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      agents: ${{ steps.filter.outputs.agents }}
      installers: ${{ steps.filter.outputs.installers }}
      frontend: ${{ steps.filter.outputs.frontend }}
      android: ${{ steps.filter.outputs.android }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        # Through the environment, not `${{ }}` inside the script: a branch
        # name is attacker-shaped text.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: scripts/ci-changes.sh

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cylist
          POSTGRES_PASSWORD: cylist
          POSTGRES_DB: cylist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cylist -d cylist_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app scripts

      # One worker per core, each on a database of its own beside
      # cylist_test (tests/conftest.py). The suite is CPU-bound, not
      # database-bound, so this is close to a core's worth of speed-up each.
      - name: Test
        run: uv run pytest -q -n auto

      # Proves the migrations produce exactly the schema the models describe,
      # and that every revision reverses cleanly. Uses its own scratch database.
      - name: Verify migrations
        run: uv run python -m scripts.check_migrations

      # The Android client is generated from a committed copy of the OpenAPI
      # document. A change to what a route takes or returns has to refresh it,
      # so the Android job builds against the contract the server now has.
      - name: Check the OpenAPI snapshot
        run: uv run python -m scripts.openapi --check

  # The CLI and the MCP server talk to the API over HTTP and are tested against
  # an httpx.MockTransport, so neither needs a database or a running backend.
  agents:
    name: ${{ matrix.package.name }} on ${{ matrix.os }}
    needs: changes
    # The legs are worked out by the changes job (scripts/ci-changes.sh): CLI
    # on Linux and on Windows when cli/ changed, MCP server on Linux when mcp/
    # did. The CLI installs the Claude Code hook and runs its presence daemon
    # on the developer's own machine, so "the developer's own machine" is part
    # of its contract. Windows is the one that differs in kind rather than in
    # detail — no AF_UNIX, no fcntl, no catchable SIGTERM — and each of those
    # is a way for the daemon to be silently unusable there. mypy is worth as
    # much as the tests here: it is the only run that reads the msvcrt
    # branches at all.
    if: needs.changes.outputs.agents != '[]'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.agents) }}

    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package.dir }}/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      # The CLI's Windows branches are invisible to a type check run as
      # Linux — mypy does not analyse a block it knows this platform never
      # reaches. This reads them without needing a Windows runner, and it is
      # how the AF_UNIX, CLOCK_BOOTTIME and getuid errors were found in the
      # first place. Cheap, and it fails on the leg people actually watch.
      - name: Type-check as Windows
        if: matrix.package.dir == 'cli' && runner.os == 'Linux'
        run: uv run mypy --platform win32 .

      - name: Test
        run: uv run pytest -q

  # The two bootstrap scripts are the first thing a new machine runs, and the
  # only thing nothing else covers: they are quoted in three READMEs and are
  # fetched straight from the default branch, so a typo in one is a typo
  # everybody pastes. Neither is executed here — that would install uv on the
  # runner — but both are parsed, which is what a typo fails.
  installers:
    name: Bootstrap scripts
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check install.sh
        run: |
          sh -n scripts/install.sh
          # POSIX sh, not bash: /bin/sh is dash on Debian and Ubuntu, which is
          # exactly where this has to work.
          shellcheck --shell=sh scripts/install.sh

      - name: Check install.ps1
        shell: pwsh
        run: |
          $problems = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install.ps1", [ref] $null, [ref] $problems) | Out-Null
          if ($problems) {
            $problems | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host 'install.ps1 parses.'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The phone app. Lint, the unit tests and a debug build, and the build is kept
  # as the run's artifact: that APK is what gets installed on a phone to try a
  # pull request, so there is nothing to build locally first. It is signed with
  # the runner's throwaway debug key, so one run's APK will not install over
  # another's without uninstalling first.
  #
  # Needs no Android device or emulator. The theme test reads
  # frontend/src/theme/tokens.css, which is why a change to that file runs
  # this job too.
  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Puts cmdline-tools on the PATH and accepts the SDK licences, so the
      # Android Gradle plugin can fetch the platform it compiles against.
      - uses: android-actions/setup-android@v4

      # Caches Gradle's dependencies and build cache between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and build
        run: ./gradlew lint test assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cylist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/

  # Everything above runs on GitHub's machines. This one runs on dnu-home-1
  # itself, through a self-hosted runner that polls GitHub outbound — which is
  # why deploying to a server behind a home router needs no inbound port, no
  # deploy key, and no secrets stored in this repository.
  deploy:
    name: Deploy to dnu-home-1
    needs: [backend, agents, installers, frontend, android]
    # Only main, and only a real push: a pull request that happens to target
    # main must not put anything on the server. A push to `staging` gets the
    # test jobs above and nothing else — staging is deployed by hand,
    # from .github/workflows/deploy-staging.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cylist]
    environment:
      name: production
      url: https://cylist.in

    steps:
      - uses: actions/checkout@v5

      # Builds the image, dumps the database, migrates, restarts the stack and
      # waits for /api/v1/health. The same script deploys by hand over SSH.
      - name: Deploy
        run: scripts/deploy.sh
